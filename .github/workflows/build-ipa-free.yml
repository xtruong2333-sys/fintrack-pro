name: Build iOS IPA (Free macOS Runner)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-ipa:
    name: Build .IPA for Sideloadly
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node Modules
        run: npm ci

      - name: Prebuild Native iOS Xcode Project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build Archive (Unsigned for Sideloadly)
        working-directory: ios
        run: |
          xcodebuild -workspace expense-tracker.xcworkspace \
            -scheme expense-tracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/expense-tracker.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Payload into .IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/expense-tracker.xcarchive/Products/Applications/*.app Payload/
          zip -r FinTrackPro.ipa Payload
          echo "File FinTrackPro.ipa packaged successfully!"

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinTrackPro-iOS-IPA
          path: FinTrackPro.ipa
          retention-days: 14
